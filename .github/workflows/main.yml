name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs: 
  test:
    runs-on:ubuntu-latest
    steps:
      - uses actions/checkoout@v3
      - nmae: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version:16
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
